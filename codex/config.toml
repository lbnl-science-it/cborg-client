#:schema https://developers.openai.com/codex/config-schema.json
# ~/.codex/config.toml
# CBorg provider configuration for OpenAI Codex CLI.
# Copy this file to ~/.codex/config.toml, then copy the profile
# files you want to use (e.g. cborg-gpt-mini.config.toml) into ~/.codex/.

# Set the default model, `profile` is not accepted
model = "cborg-coder"
model_provider = "cborg"
model_reasoning_effort = "low"

[model_providers.cborg]
name = "CBorg API"
base_url = "https://api.cborg.lbl.gov/v1"
env_key = "CBORG_API_KEY"
supports_websockets = false
wire_api = "responses"

# Recommended setting - Fast mode costs 2.5x more for 50% speedup
[features]
fast_mode = false

[notice]
fast_default_opt_out = true

# CBorg-proxied MCP servers, authenticated with your CBorg API key.
# Remove any you don't need -- each enabled server adds tool definitions to every request.

# Web search & content extraction
[mcp_servers.tavily]
url = "https://api.cborg.lbl.gov/mcp/tavily"
bearer_token_env_var = "CBORG_API_KEY"

# Up-to-date library documentation
[mcp_servers.context7]
url = "https://api.cborg.lbl.gov/mcp/context7"
bearer_token_env_var = "CBORG_API_KEY"

# Scientific literature search (arXiv, bioRxiv, medRxiv)
[mcp_servers.valency]
url = "https://api.cborg.lbl.gov/mcp/valency"
bearer_token_env_var = "CBORG_API_KEY"
