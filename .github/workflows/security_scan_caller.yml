name: Security Scan and SecObserve Upload

permissions:
  contents: read

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:
    inputs:
      fetch_depth:
        description: 'Number of commits to fetch (0 for all history)'
        required: false
        default: '1'
        type: string

env:
  WORKFLOW_VERSION: "2.10.0"

jobs:
  security_scan:
    uses: lbnl-science-it/security-workflows/.github/workflows/security_scan.yml@4441a069d8cb5205c97350c6c5b6b1d0554cc582 # published main, 2026-08-19 (central 1.23.0)
    # Named, not `secrets: inherit`. Inheriting hands the reusable workflow every
    # secret this repository holds, not the one it needs (CWE-250); the pinned
    # central workflow declares SO_API_TOKEN under `workflow_call.secrets`, so it
    # is the only one that has to travel. SO_API_BASE_URL is a `vars` entry and
    # resolves in the called workflow without being passed.
    secrets:
      SO_API_TOKEN: ${{ secrets.SO_API_TOKEN }}
    with:
      fetch_depth: ${{ inputs.fetch_depth || '1' }}
